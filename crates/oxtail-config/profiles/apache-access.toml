# Apache httpd access log (common / combined format).
name = "Apache access"
match_files = ["*apache*access*", "access_log", "access_log.*", "*httpd*access*"]
match_content = '^\S+ \S+ \S+ \[\d{1,2}/\w{3}/\d{4}:\d\d:\d\d:\d\d [+-]\d{4}\] "'

[columns]
parser = "apache_combined"
order = ["remote", "ts", "method", "path", "status", "size", "*"]

[timestamp]
column = "ts"
format = "apache"

[[rules]]
name = "HTTP 5xx"
match = { regex = '" (5\d\d) ' }
scope = "group:1"
style = { fg = "error", bold = true }
priority = 30

[[rules]]
name = "HTTP 4xx"
match = { regex = '" (4\d\d) ' }
scope = "group:1"
style = { fg = "warn" }
priority = 20

[[rules]]
name = "HTTP 2xx/3xx"
match = { regex = '" ([23]\d\d) ' }
scope = "group:1"
style = { fg = "success" }
priority = 10
