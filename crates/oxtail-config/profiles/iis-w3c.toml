# IIS / W3C extended log format (columns come from the #Fields: directive).
name = "IIS W3C"
match_files = ["u_ex*.log", "*iis*.log", "W3SVC*.log"]
match_content = '^#(Software|Version|Fields):'

[columns]
parser = "w3c"
order = ["date", "time", "*"]

[timestamp]
format = "auto"

# Built-in rules use negative priorities (-40 to -10), so a rule you add
# (priority 0) wins where they overlap.

[[rules]]
name = "Directives"
match = { regex = '^#' }
scope = "line"
style = { fg = "muted" }
priority = -35

[[rules]]
name = "HTTP 5xx"
match = { column = "sc-status", op = "ge", value = "500" }
scope = "column:sc-status"
style = { fg = "error", bold = true }
priority = -15
minimap = "error"

[[rules]]
name = "HTTP 4xx"
match = { column = "sc-status", op = "ge", value = "400" }
scope = "column:sc-status"
style = { fg = "warn", bold = true }
priority = -20

[[rules]]
name = "HTTP 5xx row"
match = { column = "sc-status", op = "ge", value = "500" }
scope = "line"
style = { bg = "error.subtle" }
priority = -15
