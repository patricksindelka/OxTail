[package]
name = "oxtail-time"
description = "Timestamp detection, go-to-time and merged views for OxTail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# `tzdb-bundle-always` embeds the IANA database so named zones work on
# Windows and on minimal containers without /usr/share/zoneinfo (portability).
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
