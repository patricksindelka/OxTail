[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/patricksindelka/OxTail"

[workspace.dependencies]
# internal
oxtail-core = { path = "crates/oxtail-core" }
oxtail-search = { path = "crates/oxtail-search" }
oxtail-highlight = { path = "crates/oxtail-highlight" }
oxtail-columns = { path = "crates/oxtail-columns" }
oxtail-time = { path = "crates/oxtail-time" }
oxtail-config = { path = "crates/oxtail-config" }
oxtail-gui = { path = "crates/oxtail-gui" }

# engine
memchr = "2.8.3"
regex = "1.13.1"
regex-automata = "0.4.18"
regex-syntax = "0.8.11"
aho-corasick = "1.1.5"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
notify = "8.2.0"
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
lru = "0.18.5"
parking_lot = "0.12.5"
roaring = "0.11.5"
csv-core = "0.1.13"
jiff = "0.2.37"
same-file = "1.0.6"

# config / io
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
directories = "6.0.0"
tempfile = "3.27.0"

# app
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow", "wayland", "x11"] }
egui = "0.35.0"
egui_extras = "0.35.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
notify-rust = { version = "4.18.1", default-features = false, features = ["z"] }
interprocess = "2.4.4"
lexopt = "0.3.2"
pollster = "0.4.0"

# errors / logging
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# dev
proptest = "1.11.0"
criterion = "0.8.2"
insta = "1.48.0"
egui_kittest = "0.35.0"
fastrand = "2.5.0"
object = { version = "0.40.0", default-features = false, features = ["read"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
