# nfpm config for the .deb and .rpm (one file for both formats).
# Run from the repository root:
#   mkdir -p dist/stage && cp <built binary> dist/stage/oxtail
#   VERSION=0.1.0 \
#     nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/
# Paths are relative to the working directory; VERSION is expanded from the
# environment. The binary is staged at dist/stage/oxtail.
name: oxtail
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: utils
priority: optional
maintainer: The OxTail contributors <noreply@users.noreply.github.com>
description: |
  Fast, portable, real-time log viewer.
  OxTail opens huge files instantly, follows them as they grow (surviving
  truncation and rotation), searches, filters and highlights them, and parses
  lines into columns.
homepage: https://github.com/patricksindelka/OxTail
license: MIT OR Apache-2.0
contents:
  - src: dist/stage/oxtail
    dst: /usr/bin/oxtail
    file_info:
      mode: 0755
  - src: packaging/linux/io.github.patricksindelka.OxTail.desktop
    dst: /usr/share/applications/io.github.patricksindelka.OxTail.desktop
    file_info:
      mode: 0644
  - src: packaging/linux/io.github.patricksindelka.OxTail.metainfo.xml
    dst: /usr/share/metainfo/io.github.patricksindelka.OxTail.metainfo.xml
    file_info:
      mode: 0644
  - src: packaging/icons/oxtail.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.patricksindelka.OxTail.svg
    file_info:
      mode: 0644
  - src: packaging/icons/oxtail-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.patricksindelka.OxTail.png
    file_info:
      mode: 0644
  - src: packaging/icons/oxtail-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/io.github.patricksindelka.OxTail.png
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - libc6 (>= 2.28)
    recommends:
      # dlopen'ed at runtime (X11/Wayland/GL/Vulkan); one of each family is enough.
      - libxkbcommon0
      - libgl1
      - libwayland-client0
      - libx11-6
  rpm:
    depends:
      - glibc >= 2.28
    recommends:
      - libxkbcommon
      - mesa-libGL
      - libwayland-client
      - libX11
