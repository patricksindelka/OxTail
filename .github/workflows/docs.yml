name: Docs

# Builds the user guide (docs/book, an mdBook) and publishes it to GitHub Pages.
# Opt-in, to save Actions minutes and because Pages needs setting up first:
#   * pushes to the default branch touching the docs deploy ONLY when the
#     repository variable PAGES_ENABLED is 'true' (Settings > Secrets and
#     variables > Actions > Variables), after enabling Pages with
#     Settings > Pages > Build and deployment > Source: "GitHub Actions".
#     (Pages on a private repository needs a paid GitHub plan.)
#   * a manual run (Actions > Docs > Run workflow) always checks and builds, and
#     deploys when PAGES_ENABLED is 'true'.
# The docs consistency check (gen-docs --check) also runs in CI through
# `cargo test -p xtask`, so pull requests need nothing from this workflow.

on:
  push:
    paths:
      - 'docs/**'
      - 'xtask/**'
      - 'crates/oxtail-config/profiles/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned; bump together with the sha256 below (sha256sum of the .tar.gz asset).
  MDBOOK_VERSION: 0.5.2
  MDBOOK_SHA256: 084e4342ba564db270108763e404a7d1f309d932651a22484e93c0dc1a071f6d

jobs:
  build:
    name: Check and build
    # Manual runs always build; pushes only on the default branch with Pages enabled.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.PAGES_ENABLED == 'true' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Loads every built-in and gallery profile with the real loader (failing on any
      # warning) and fails if docs/book/src/gallery/* or SUMMARY.md is out of date.
      # Fix with: cargo run -p xtask -- gen-docs
      - name: Check the generated gallery
        run: cargo run --locked -q -p xtask -- gen-docs --check

      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/mdbook.tar.gz" "$url"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Build the book
        run: |
          mdbook --version
          mdbook build docs/book

      - name: Configure Pages
        if: vars.PAGES_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@v5

      - name: Upload the site
        if: vars.PAGES_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/book/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: vars.PAGES_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment that is running.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
