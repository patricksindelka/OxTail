name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast

  portability:
    timeout-minutes: 45
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # RUSTFLAGS replaces the target rustflags in .cargo/config.toml, so repeat
      # the static CRT here or the Windows build links the dynamic one.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --release -p oxtail-cli
      - run: cargo run -q -p xtask -- check-deps --binary target/release/oxtail${{ runner.os == 'Windows' && '.exe' || '' }}
      # Downloadable test builds (not releases): the binary plus the `portable`
      # marker, so settings stay in an `oxtail-data` folder next to it.
      - name: Stage the portable build
        shell: bash
        run: |
          mkdir -p dist/oxtail
          cp target/release/oxtail${{ runner.os == 'Windows' && '.exe' || '' }} dist/oxtail/
          touch dist/oxtail/portable
      - uses: actions/upload-artifact@v6
        with:
          name: oxtail-${{ runner.os }}-${{ runner.arch }}
          path: dist/oxtail
          retention-days: 30

  fuzz-build:
    # cargo-fuzz needs nightly (sanitizer flags). The build must pass.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          cache-on-failure: true
      - run: cargo install cargo-fuzz --locked
      - name: Build all fuzz targets
        working-directory: fuzz
        run: cargo fuzz build

  fuzz-smoke:
    # Short timed runs of every target. Findings are reported but do not fail
    # the build (continue-on-error); crash artifacts are uploaded.
    timeout-minutes: 20
    needs: fuzz-build
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - index_vs_naive
          - transcoder
          - read_lines
          - search_matcher
          - highlight_rules
          - ansi_parse
          - time_detect
          - config_session_json
          - config_settings_toml
          - columns_parsers
          - columns_detect
          - columns_query
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          cache-on-failure: true
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} for 30 s
        working-directory: fuzz
        continue-on-error: true
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=30 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
